# Render Blueprint for Receipts: New > Blueprint > connect your GitHub repo.
# Neither API key is stored in this file. Render prompts for them on first deployment.
services:
  - type: web
    name: receipts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LIVE_RUNS_PER_HOUR
        value: "12"
      - key: LIVE_RUNS_PER_DAY
        value: "300"
